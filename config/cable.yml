# Development uses the postgresql adapter, which is shared across processes, so broadcasts sent
# from jobs (a separate Solid Queue process, or Puma plugin) reach browsers. The async adapter
# only delivers within a single process.
development:
  adapter: postgresql

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 5.minutes
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
