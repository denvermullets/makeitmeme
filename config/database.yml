default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: makeitmeme_development<%= ENV["DB_SUFFIX"] %>
  cable:
    <<: *default
    database: makeitmeme_development_cable<%= ENV["DB_SUFFIX"] %>
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: makeitmeme_test<%= ENV["DB_SUFFIX"] %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *primary_production
    url: <%= ENV['CACHE_DATABASE_URL'] %>
  queue:
    <<: *primary_production
    url: <%= ENV['DATABASE_QUEUE_URL'] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    url: <%= ENV['DATABASE_CABLE_URL'] %>
    migrations_paths: db/cable_migrate
